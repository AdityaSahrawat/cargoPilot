[project]
name = "cargopilot-simulation"
version = "1.0.0"
description = "CargoPilot Simulation Engine — Discrete-event logistics simulation service"
requires-python = ">=3.12"

dependencies = [
    # Simulation engine
    "simpy>=4.1.1",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Kafka (consumer only — simulation receives decisions, does not publish)
    "confluent-kafka>=2.6.0",
    # Data / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Numerical / distributions
    "numpy>=2.1.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "pulp>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

